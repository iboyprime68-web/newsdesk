name: newsdesk

# Cron is only a relauncher here, not the clock. GitHub's scheduler is unreliable and
# capped at 5-minute granularity, so a run that merely polls once would inherit both
# problems. Instead each run holds a rolling window and polls every 60 seconds from
# inside the job, which gives sub-minute news and keeps @Breaking-Ping posts trickling
# one at a time rather than arriving in a clump after a long gap.
#
# The concurrency group means only one window is ever live.
#
# THE CRON MUST NOT FIRE DURING THE WINDOW (fixed Aug 2026). This was "*/5" on the
# theory that ticks landing mid-window would queue behind it and run back to back.
# They do not. GitHub keeps at most ONE pending run per concurrency group and CANCELS
# that pending run the moment a newer tick arrives - and a cancelled run mails the
# owner "Run failed: newsdesk - All jobs were cancelled" exactly like a real failure.
# That is what was filling his inbox. Hourly at :07 starts one window that ends around
# :59, so the next tick always arrives to an idle group and nothing is ever cancelled.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}
  repository_dispatch:
    types: [check-now]

permissions:
  contents: write

concurrency:
  group: newsdesk-pipeline
  cancel-in-progress: false

env:
  WINDOW_MINUTES: 52          # must end before the next hourly tick at :07 - see above
  TICK_SECONDS: 60
  PUSH_STATE_EVERY_TICKS: 5

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: state
          path: .state

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --omit=dev

      - name: Poll feeds on a rolling window
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          STATE_DIR: .state
        run: |
          git -C .state config user.name "newsdesk-state"
          git -C .state config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          persist_state() {
            [ -f state-out/state.json ] || return 0
            cp state-out/state.json .state/state.json
            git -C .state add state.json
            git -C .state diff --cached --quiet && return 0
            git -C .state commit --amend -q -m "state $(date -u +%FT%TZ)"
            for attempt in 1 2 3; do
              git -C .state push -q --force-with-lease origin HEAD:state && return 0
              git -C .state fetch -q origin state
              git -C .state reset -q --hard origin/state
              cp state-out/state.json .state/state.json
              git -C .state add state.json
              git -C .state commit --amend -q -m "state $(date -u +%FT%TZ)"
              sleep $((RANDOM % 5 + 2))
            done
            echo "::warning::state push failed after 3 attempts"
          }

          END=$(( SECONDS + WINDOW_MINUTES * 60 ))
          tick=0
          failures=0
          while [ $SECONDS -lt $END ]; do
            tick=$(( tick + 1 ))
            if ! node src/run.js; then
              failures=$(( failures + 1 ))
              echo "::warning::tick $tick reported a failure"
            fi
            if [ $(( tick % PUSH_STATE_EVERY_TICKS )) -eq 0 ]; then persist_state; fi
            # Stop early rather than start a tick that would overrun the window.
            [ $(( SECONDS + TICK_SECONDS )) -ge $END ] && break
            sleep $TICK_SECONDS
          done

          persist_state
          echo "window finished: $tick ticks, $failures with failures"

      - name: Persist state
        if: always()
        run: |
          git -C .state config user.name "newsdesk-state"
          git -C .state config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f state-out/state.json ] || exit 0
          cp state-out/state.json .state/state.json
          git -C .state add state.json
          git -C .state diff --cached --quiet && exit 0
          git -C .state commit --amend -q -m "state $(date -u +%FT%TZ)"
          git -C .state push -q --force-with-lease origin HEAD:state || true

      - name: Report failure to bot-status
        if: failure()
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: node src/lib/report-failure.js "$GITHUB_RUN_ID"

name: newsdesk
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
  repository_dispatch:
    types: [check-now]

permissions:
  contents: write

concurrency:
  group: newsdesk-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: state
          path: .state

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --omit=dev

      - name: Run pipeline
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          STATE_DIR: .state
        run: node src/run.js

      # The state branch is a cache, not history: this file changes ~288x/day, so we
      # amend a single commit and force-push rather than growing the repo forever.
      # The concurrency group means runs never truly overlap; the retry loop covers
      # re-runs and transient push failures.
      - name: Persist state
        if: always()
        working-directory: .state
        run: |
          git config user.name "newsdesk-state"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f ../state-out/state.json ]; then
            echo "pipeline produced no state — nothing to persist"
            exit 0
          fi
          for i in 1 2 3; do
            cp ../state-out/state.json state.json
            git add state.json
            if git diff --cached --quiet; then
              echo "state unchanged"
              exit 0
            fi
            git commit --amend -m "state $(date -u +%FT%TZ)"
            if git push --force-with-lease origin HEAD:state; then
              exit 0
            fi
            echo "push rejected, resyncing (attempt $i)"
            git fetch origin state
            git reset --hard origin/state
            sleep $((RANDOM % 5 + 2))
          done
          exit 1

      - name: Report failure to bot-status
        if: failure()
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: node src/lib/report-failure.js "$GITHUB_RUN_ID"
